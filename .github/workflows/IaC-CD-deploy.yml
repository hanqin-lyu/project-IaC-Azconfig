---
name: Terraform Apply (IaC-CD)

"on":
  push:
    branches: [main]
    paths:
      - '02-workload-resources/**'

permissions:
  contents: read
  id-token: write

# Serialise runs against the same state; never cancel an in-flight apply
concurrency:
  group: terraform-02-workload-resources
  cancel-in-progress: false

jobs:
  terraform-apply:
    name: "Terraform Apply"
    runs-on: ubuntu-latest
    # Manual approval gate: configure Required reviewers on this Environment in GitHub.
    # The OIDC subject becomes repo:<owner>/<repo>:environment:production-demo,
    # so the CD identity's federated credential must use that subject.
    environment: production-demo
    defaults:
      run:
        working-directory: 02-workload-resources
    # terraform.tfvars is gitignored, so CD supplies the non-default values itself
    env:
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_tenant_id: ${{ secrets.AZURE_CD_TENANT_ID }}
      TF_VAR_resource_group_name: Project-AzIaC
      TF_VAR_project_name: aziac
      TF_VAR_environment: demodeny
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login (CD Identity - Read/Write)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CD_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_CD_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve
