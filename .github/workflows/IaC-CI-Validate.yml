---
name: "Terraform Validate & Security Scan"

"on":
  pull_request:
    branches: ["main"]
    paths:
      - '02-workload-resources/**'

permissions:
  contents: read
  id-token: write
  security-events: write

jobs:
  fmt-and-validate:
    name: "Terraform Format & Validate"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 02-workload-resources
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Azure Login (CI Identity - Read Only)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CI_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_CI_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

  checkov-scan:
    name: "Pre-deployment Security Scan (Shift-Left)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov IaC Scanner
        uses: bridgecrewio/checkov-action@master
        with:
          directory: 02-workload-resources
          framework: terraform
          output_format: sarif
          output_file_path: checkov-results.sarif
          soft_fail: false

      - name: Upload Checkov SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: success() || failure()
        with:
          sarif_file: checkov-results.sarif
          category: checkov

  terraform-plan:
    name: "Terraform Plan Preview"
    needs: [fmt-and-validate, checkov-scan]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 02-workload-resources
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login (CI Identity - Read Only)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CI_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_CI_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan
